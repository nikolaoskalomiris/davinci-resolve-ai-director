name: Public Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned Windows release artifacts
    runs-on: windows-2022
    timeout-minutes: 330

    env:
      VS_BUILDTOOLS_ROOT: 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools'
      CUDA_TOOLKIT_VERSION: '13.3.1'
      CUDA_NETWORK_INSTALLER: 'https://developer.download.nvidia.com/compute/cuda/13.3.1/network_installers/cuda_13.3.1_windows_network.exe'

    steps:
      - name: Check out public source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify GitHub-hosted source boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw "This workflow requires a GitHub-hosted runner."
          }

          $status = git status --porcelain=v1
          if ($LASTEXITCODE -ne 0) {
            throw "git status failed."
          }
          if ($status) {
            throw "Checkout is not clean."
          }

          foreach ($name in @('_cache', '_inputs', '_toolchain', 'node_modules', 'AI-Director-Release-Candidates')) {
            if (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $name)) {
              throw "Generated/private prebuild path is present: $name"
            }
          }

          Write-Host "CI_SOURCE_BOUNDARY=PASS"
          Write-Host "CI_COMMIT=$env:GITHUB_SHA"
          Write-Host "CI_RUNNER_ENVIRONMENT=$env:RUNNER_ENVIRONMENT"

      - name: Install Visual Studio Build Tools 2022 17.14 with fixed bootstrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bootstrapperUrl = 'https://download.visualstudio.microsoft.com/download/pr/c95450be-0a45-4779-b142-33f567ccfd6e/2a6aa7d94e38d457a4eb3930fc60056ecab06865b2eb925e5275b8473a017583/vs_BuildTools.exe'
          $bootstrapperSha256 = '2A6AA7D94E38D457A4EB3930FC60056ECAB06865B2EB925E5275B8473A017583'
          $expectedInstallationMajor = 17
          $expectedInstallationMinor = 14
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools-17.14.42.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'

          Invoke-WebRequest -UseBasicParsing -Uri $bootstrapperUrl -OutFile $bootstrapper

          $actualBootstrapperSha256 = (Get-FileHash -LiteralPath $bootstrapper -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualBootstrapperSha256 -ne $bootstrapperSha256) {
            throw "Fixed Visual Studio bootstrapper SHA256 mismatch."
          }

          $argumentString = @(
            '--quiet'
            '--wait'
            '--norestart'
            '--nocache'
            '--installPath'
            ('"' + $env:VS_BUILDTOOLS_ROOT + '"')
            '--add'
            'Microsoft.VisualStudio.Workload.VCTools'
            '--add'
            'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
            '--add'
            'Microsoft.VisualStudio.Component.VC.CMake.Project'
            '--add'
            'Microsoft.VisualStudio.Component.Windows11SDK.26100'
          ) -join ' '

          $process = Start-Process `
            -FilePath $bootstrapper `
            -ArgumentList $argumentString `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Visual Studio Build Tools 17.14 installation failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe is missing after Build Tools installation."
          }

          $installationPath = (& $vswhere `
            -products Microsoft.VisualStudio.Product.BuildTools `
            -property installationPath | Select-Object -First 1).Trim()

          $installationVersion = (& $vswhere `
            -products Microsoft.VisualStudio.Product.BuildTools `
            -property installationVersion | Select-Object -First 1).Trim()

          if ($installationPath -ne $env:VS_BUILDTOOLS_ROOT) {
            throw "Build Tools installation path mismatch. Expected=$env:VS_BUILDTOOLS_ROOT Actual=$installationPath"
          }

          $parsedInstallationVersion = $null
          if (-not [version]::TryParse($installationVersion, [ref]$parsedInstallationVersion)) {
            throw "Build Tools installation version is not parseable: $installationVersion"
          }

          if ($parsedInstallationVersion.Major -ne $expectedInstallationMajor -or
              $parsedInstallationVersion.Minor -ne $expectedInstallationMinor) {
            throw "Build Tools major/minor mismatch. Expected=17.14 Actual=$installationVersion"
          }

          Write-Host "CI_VS_BUILDTOOLS_VERSION=$installationVersion"
          Write-Host "CI_VS_BUILDTOOLS_MAJOR_MINOR=17.14"
          Write-Host "CI_VS_SHELL_SERVICING_VERSION_STRICT=False"
          Write-Host "CI_VS_COMPILER_TOOL_HASHES_STRICT=YES_NEXT_GATE"
          Write-Host "CI_VS_FIXED_BOOTSTRAPPER_SHA256=$actualBootstrapperSha256"
          Write-Host "CI_VS_FIXED_INSTALL=PASS"

      - name: Install exact Windows SDK 10.0.26100.9457 servicing level
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $sdkDownloadsPage = 'https://learn.microsoft.com/en-us/windows/apps/windows-sdk/downloads'
          $targetSdkProductVersion = '10.1.26100.9457'
          $targetToolVersion = '10.0.26100.9457'
          $rc = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\rc.exe'
          $mt = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\mt.exe'
          $expectedRcSha256 = '9E2EE68DA28B3318F50A9F1008D64567A9B402BDA384A007A9B71A3F16BD011B'
          $expectedMtSha256 = 'FA74DD31612C78DE40169599640FB955EF9CCB9F2DFABF80F100022FF1B8BC22'
          $sdkInstaller = Join-Path $env:RUNNER_TEMP 'winsdksetup-10.0.26100.9457.exe'

          function Test-ExactSdkTools {
            if (-not (Test-Path -LiteralPath $rc -PathType Leaf) -or
                -not (Test-Path -LiteralPath $mt -PathType Leaf)) {
              return $false
            }

            $rcHash = (Get-FileHash -LiteralPath $rc -Algorithm SHA256).Hash.ToUpperInvariant()
            $mtHash = (Get-FileHash -LiteralPath $mt -Algorithm SHA256).Hash.ToUpperInvariant()
            $rcVersion = (Get-Item -LiteralPath $rc).VersionInfo.ProductVersion
            $mtVersion = (Get-Item -LiteralPath $mt).VersionInfo.ProductVersion

            return (
              $rcHash -eq $expectedRcSha256 -and
              $mtHash -eq $expectedMtSha256 -and
              $rcVersion -eq $targetToolVersion -and
              $mtVersion -eq $targetToolVersion
            )
          }

          if (-not (Test-ExactSdkTools)) {
            $page = Invoke-WebRequest -UseBasicParsing -Uri $sdkDownloadsPage
            $html = [string]$page.Content

            $pattern = '(?is)Windows SDK for Windows 11\s*\(10\.0\.26100\.9457\).*?href=["''](?<url>[^"'']+)["''][^>]*>\s*Installer\s*</a>'
            $match = [regex]::Match($html, $pattern)

            if (-not $match.Success) {
              throw "Unable to discover the official Windows SDK 10.0.26100.9457 installer URL from Microsoft Learn."
            }

            $sdkInstallerUrl = $match.Groups['url'].Value
            if ($sdkInstallerUrl -notmatch '^https://(go\.microsoft\.com|download\.microsoft\.com)/') {
              throw "Discovered Windows SDK installer URL is not an allowed Microsoft download endpoint: $sdkInstallerUrl"
            }

            Write-Host "CI_WINDOWS_SDK_9457_INSTALLER_URL=$sdkInstallerUrl"

            Invoke-WebRequest -UseBasicParsing -Uri $sdkInstallerUrl -OutFile $sdkInstaller

            $signature = Get-AuthenticodeSignature -LiteralPath $sdkInstaller
            if ($signature.Status -ne 'Valid' -or
                -not $signature.SignerCertificate -or
                $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Windows SDK 10.0.26100.9457 installer Authenticode verification failed."
            }

            $process = Start-Process `
              -FilePath $sdkInstaller `
              -ArgumentList '/features OptionId.DesktopCPPx64 /quiet /norestart /ceip off' `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Windows SDK 10.0.26100.9457 installation failed with exit code $($process.ExitCode)."
            }
          }

          $actualRcSha256 = if (Test-Path -LiteralPath $rc -PathType Leaf) {
            (Get-FileHash -LiteralPath $rc -Algorithm SHA256).Hash.ToUpperInvariant()
          } else {
            'MISSING'
          }
          $actualMtSha256 = if (Test-Path -LiteralPath $mt -PathType Leaf) {
            (Get-FileHash -LiteralPath $mt -Algorithm SHA256).Hash.ToUpperInvariant()
          } else {
            'MISSING'
          }
          $actualRcVersion = if (Test-Path -LiteralPath $rc -PathType Leaf) {
            (Get-Item -LiteralPath $rc).VersionInfo.ProductVersion
          } else {
            'MISSING'
          }
          $actualMtVersion = if (Test-Path -LiteralPath $mt -PathType Leaf) {
            (Get-Item -LiteralPath $mt).VersionInfo.ProductVersion
          } else {
            'MISSING'
          }

          Write-Host "CI_WINDOWS_SDK_RC_VERSION=$actualRcVersion"
          Write-Host "CI_WINDOWS_SDK_RC_SHA256=$actualRcSha256"
          Write-Host "CI_WINDOWS_SDK_MT_VERSION=$actualMtVersion"
          Write-Host "CI_WINDOWS_SDK_MT_SHA256=$actualMtSha256"

          if (-not (Test-ExactSdkTools)) {
            throw "Exact Windows SDK 10.0.26100.9457 rc.exe/mt.exe identities were not established."
          }

          $sdkEntry = Get-ItemProperty `
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Publisher -like 'Microsoft*' -and
              $_.DisplayVersion -eq $targetSdkProductVersion
            } |
            Select-Object -First 1

          if (-not $sdkEntry) {
            throw "Windows SDK product registration $targetSdkProductVersion was not found after exact-tool validation."
          }

          Write-Host "CI_WINDOWS_SDK_PRODUCT_VERSION=$targetSdkProductVersion"
          Write-Host "CI_WINDOWS_SDK_EXACT_RC_MT=PASS"

      - name: Verify exact Microsoft toolchain hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $contractPath = Join-Path $env:GITHUB_WORKSPACE 'build\direct\AI-Director-Direct-Source-Build-Contract-v1.json'
          if (-not (Test-Path -LiteralPath $contractPath -PathType Leaf)) {
            throw "Direct build contract is missing."
          }

          $contract = Get-Content -LiteralPath $contractPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $toolNames = @(
            'cmake.exe',
            'ninja.exe',
            'cl.exe',
            'link.exe',
            'lib.exe',
            'rc.exe',
            'mt.exe',
            'vcvars64.bat'
          )

          $mismatches = @()

          foreach ($name in $toolNames) {
            $record = $contract.toolchain.tools.$name
            if (-not $record) {
              $mismatches += "MISSING_CONTRACT_RECORD $name"
              continue
            }

            $path = [string]$record.path
            $expected = ([string]$record.sha256).ToUpperInvariant()

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $mismatches += "MISSING_FILE $name path=$path expected=$expected"
              continue
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $expected) {
              $mismatches += "SHA256_MISMATCH $name expected=$expected actual=$actual path=$path"
              continue
            }

            Write-Host "CI_MICROSOFT_TOOLCHAIN_HASH_PASS=$name"
          }

          if ($mismatches.Count -ne 0) {
            $mismatches | ForEach-Object { Write-Host "CI_MICROSOFT_TOOLCHAIN_MISMATCH=$_" }
            throw "Microsoft toolchain exact hash gate failed with $($mismatches.Count) mismatch(es)."
          }

          Write-Host "CI_MICROSOFT_TOOLCHAIN_HASH_COUNT=8"
          Write-Host "CI_MICROSOFT_TOOLCHAIN_HASH_SET=PASS"

      - name: Install CUDA Toolkit 13.3.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nvcc = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\nvcc.exe'
          if (-not (Test-Path -LiteralPath $nvcc -PathType Leaf)) {
            $installer = Join-Path $env:RUNNER_TEMP 'cuda_13.3.1_windows_network.exe'

            Invoke-WebRequest -UseBasicParsing `
              -Uri $env:CUDA_NETWORK_INSTALLER `
              -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '-s' `
              -Wait `
              -PassThru

            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              throw "CUDA Toolkit installation failed with exit code $($process.ExitCode)."
            }
          }

          if (-not (Test-Path -LiteralPath $nvcc -PathType Leaf)) {
            throw "nvcc.exe is missing after CUDA Toolkit installation."
          }

          $version = & $nvcc --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $version -notmatch 'release 13\.3' -or
              $version -notmatch 'V13\.3\.73') {
            throw "Unexpected nvcc identity: $version"
          }

          Write-Host "CI_CUDA_PREREQUISITE=PASS"
          Write-Host "CI_NVCC=V13.3.73"

      - name: Verify exact full system toolchain hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $contractPath = Join-Path $env:GITHUB_WORKSPACE 'build\direct\AI-Director-Direct-Source-Build-Contract-v1.json'
          if (-not (Test-Path -LiteralPath $contractPath -PathType Leaf)) {
            throw "Direct build contract is missing."
          }

          $contract = Get-Content -LiteralPath $contractPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $tools = @($contract.toolchain.tools.PSObject.Properties)

          if ($tools.Count -ne 14) {
            throw "Expected exactly 14 system-toolchain records in the Direct contract."
          }

          foreach ($tool in $tools) {
            $name = [string]$tool.Name
            $record = $tool.Value
            $path = [string]$record.path
            $expected = ([string]$record.sha256).ToUpperInvariant()

            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required system-toolchain file is missing: $name :: $path"
            }

            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $expected) {
              throw "System-toolchain SHA256 mismatch: $name Expected=$expected Actual=$actual"
            }

            Write-Host "CI_TOOLCHAIN_HASH_PASS=$name"
          }

          Write-Host "CI_SYSTEM_TOOLCHAIN_HASH_COUNT=14"
          Write-Host "CI_SYSTEM_TOOLCHAIN_HASH_SET=PASS"

      - name: Prepare long-path build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $shortTemp = 'D:\t'
          New-Item -ItemType Directory -Force -Path $shortTemp | Out-Null

          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to enable Git long-path support."
          }

          $longPaths = (git config --global --get core.longpaths).Trim()
          if ($LASTEXITCODE -ne 0 -or $longPaths -ne 'true') {
            throw "Git long-path configuration did not persist."
          }

          foreach ($name in @('TEMP', 'TMP', 'TMPDIR')) {
            Add-Content `
              -LiteralPath $env:GITHUB_ENV `
              -Value "$name=$shortTemp" `
              -Encoding UTF8
          }

          Write-Host "CI_GIT_CORE_LONGPATHS=$longPaths"
          Write-Host "CI_BUILD_TEMP_ROOT=$shortTemp"
          Write-Host "CI_LONG_PATH_ENVIRONMENT=PASS"

      - name: Run authoritative public build
        shell: cmd
        run: BUILD.cmd

      - name: Check public build state
        shell: cmd
        run: CHECK-STATE.cmd

      - name: Collect build evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseStatePath = Join-Path $env:GITHUB_WORKSPACE 'build\package\release-state.json'
          if (-not (Test-Path -LiteralPath $releaseStatePath -PathType Leaf)) {
            throw "release-state.json is missing from the checked-out public source."
          }

          $releaseState = Get-Content -LiteralPath $releaseStatePath -Raw -Encoding UTF8 | ConvertFrom-Json

          if ([string]$releaseState.state_mode -ne 'ACCEPTED_READY') {
            throw "Public checked-out build evidence requires ACCEPTED_READY state."
          }

          $targetVersion = [string]$releaseState.target_version
          $acceptedVersion = [string]$releaseState.live_accepted_authority

          if (-not $targetVersion -or $targetVersion -ne $acceptedVersion) {
            throw "Public checked-out build target/accepted authority mismatch. Target=$targetVersion Accepted=$acceptedVersion"
          }

          $workspaceParent = Split-Path -Parent $env:GITHUB_WORKSPACE
          $candidateVersionRoot = Join-Path $workspaceParent "AI-Director-Release-Candidates\$targetVersion"

          if (-not (Test-Path -LiteralPath $candidateVersionRoot -PathType Container)) {
            throw "Release candidate version root was not produced: $candidateVersionRoot"
          }

          $candidate = Get-ChildItem -LiteralPath $candidateVersionRoot -Directory |
            Sort-Object Name |
            Select-Object -Last 1

          if (-not $candidate) {
            throw "No release candidate directory was produced."
          }

          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE '_ci_evidence'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null

          $records = @()
          Get-ChildItem -LiteralPath $candidate.FullName -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Substring($candidate.FullName.Length).TrimStart('\')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant()

            $records += [pscustomobject]@{
              relative_path = $relative
              bytes = [int64]$_.Length
              sha256 = $hash
            }

            if ($_.Extension -in @('.json', '.txt')) {
              $safeName = ($relative -replace '[\\/:*?"<>|]', '__')
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $evidenceRoot $safeName)
            }
          }

          $manifest = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            runner_environment = $env:RUNNER_ENVIRONMENT
            candidate = $candidate.Name
            files = @($records)
          }

          $manifestPath = Join-Path $evidenceRoot 'CI-BUILD-ARTIFACT-MANIFEST.json'
          [System.IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 8),
            (New-Object System.Text.UTF8Encoding($false))
          )

          $installers = @($records | Where-Object { $_.relative_path -like '*.exe' })
          if ($installers.Count -lt 2) {
            throw "Expected at least two installer executables in the build candidate."
          }

          Write-Host "CI_BUILD_EVIDENCE=PASS"
          Write-Host "CI_CANDIDATE=$($candidate.Name)"
          Write-Host "CI_INSTALLER_COUNT=$($installers.Count)"

      - name: Upload public build evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-build-evidence-${{ github.run_id }}
          path: _ci_evidence
          if-no-files-found: error
          retention-days: 7
